apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sites
  namespace: yatest
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  hostnames:
    - its3.systementor.se
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: yagolangsite-service
          port: 80
